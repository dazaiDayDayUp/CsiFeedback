model:
  name: "path_geometry_feedback"
  encoded_dim: 64
  extra:
    num_paths: 8
    latent_size: 4
    hidden_dim: 128
    base_channels: 64
    output_activation: "identity"
    clamp_output: true
    delay_fft_size: 1024
    path_loss_weight: 0.2
    peak_loss_weight: 0.005
    peak_loss_warmup: 150
    peak_loss_decay: 250
data:
  data_dir: "./data"
  scenario: "indoor"
  batch_size: 200
  num_workers: 0
  pin_memory: false
  load_raw: true
optimizer:
  name: "adam"
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.0
  separate_enc_dec: false
scheduler:
  name: "const"
training:
  epochs: 1000
  device: "auto"
  seed: 0
  val_freq: 10
  test_freq: 10
  print_freq: 20
  checkpoint_dir: "./experiments"
  checkpoint_freq: 50
  resume: null
  select_best: "all"
